# Baseline: старая логика (per-slot ROI scan). Контрольная точка матрицы.
# Все остальные конфиги наследуют формат, меняют только da_strategy / da_weights / post-hoc.
canonical_map: storm_point
frame_step: 60
anchors_file: ../../motion_detect/reports/motion_tracks.json
eliminations_file: ../../hud_read/reports/eliminations.json
zones_file: ../../../configs/zones.vod.json

# Старая логика: оставляем default, явно для читаемости.
da_strategy: per_slot_roi

registration:
  detector: sift
  max_features: 4000
  clahe: true
  canonical_target_w: 1600
  match_ratio: 0.75
  ransac_reproj_px: 5.0
  min_inliers: 15
  roi: [0.21875, 0.0, 0.78125, 1.0]

detection:
  min_area_px: 40
  max_area_px: 2400
  morph_kernel: 3

slot_tracker:
  roi_size: 220
  min_tracked_for_active: 20
  min_tracked_ratio_for_active: 0.20
  near_anchor_radius_canonical_px: 120.0

tracking:
  max_gap_frames: 30
  gating_world_dist: 50.0
  process_noise: 1.0
  measurement_noise: 4.0
  init_warmup_sec: 30.0
  init_reject_world_margin: 30.0
  init_min_score: 0.4

# Per-slot weight overrides + late-game gate shrink.
# (baseline uses per_slot_roi strategy, so da_weights/slot_overrides
# only kick in if you flip da_strategy=detect_first — kept here for
# reproducibility with detect_first presets below.)
da_weights:
  slot_overrides:
    # slot_11: 6 id-switches в матрице baseline (179/300/420/540s) —
    # путается с slot_9/12/15/17. Узкий gate + блок кросс-цвета.
    slot_11:
      delta_color_mismatch: 10.0
      gate_radius_mult: 0.7
      eps_hysteresis: 0.5
    # slot_20: 6 id-switches (300/419s) — путается со slot_6/7.
    slot_20:
      delta_color_mismatch: 10.0
      gate_radius_mult: 0.7
      eps_hysteresis: 0.5

# Late-game collision protection: когда live-треки слиплись в малом круге
# (median pairwise canonical_px distance < cluster_threshold_px), временно
# режем gate всем слотам в gate_shrink раз. Фикс эпизода ~660s в baseline.
late_game:
  enabled: true
  t_min_sec: 300.0
  cluster_threshold_px: 250.0
  gate_shrink: 0.4


output:
  include_frame_px: true
  include_canonical_px: true