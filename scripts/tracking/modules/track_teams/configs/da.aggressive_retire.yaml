# Detect-first + жёсткий post-hoc: ловим максимум фантомов даже среди HUD-alive.
# Покажет верхнюю границу "сколько слотов можно ретайрить без потери реальных".
canonical_map: storm_point
frame_step: 60
anchors_file: ../../motion_detect/reports/motion_tracks.json
eliminations_file: ../../hud_read/reports/eliminations.json
zones_file: ../../../configs/zones.vod.json

da_strategy: detect_first
da_weights: { beta_world: 1.0, gamma_shape: 0.3, delta_color_mismatch: 0.5,
              eps_hysteresis: 0.2, gate_radius_mult: 1.0,
              fallback_gate_canonical_px: 200.0 }

registration: { detector: sift, max_features: 4000, clahe: true, canonical_target_w: 1600,
                match_ratio: 0.75, ransac_reproj_px: 5.0, min_inliers: 15,
                roi: [0.21875, 0.0, 0.78125, 1.0] }
detection: { min_area_px: 40, max_area_px: 2400, morph_kernel: 3 }
slot_tracker:
  roi_size: 220
  min_tracked_for_active: 40      # было 20
  min_tracked_ratio_for_active: 0.30   # было 0.20
  near_anchor_radius_canonical_px: 100.0
tracking: { max_gap_frames: 30, gating_world_dist: 50.0, process_noise: 1.0, measurement_noise: 4.0 }
output: { include_frame_px: true, include_canonical_px: true }da_debug_near_miss: true
